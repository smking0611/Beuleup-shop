<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beuleup Shop — Admin</title>
<style>
:root{--bg:#070707;--panel:#111;--gold:#d7a72f;--gold2:#ffd86a;--text:#f7f7f4;--muted:#aaa;--line:#292929}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#d7a72f18,transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
.box{width:min(430px,100%);background:#0e0e0e;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 20px 70px #000}
.brand{text-align:center;font-weight:900;letter-spacing:4px;font-size:25px}.brand span{color:var(--gold2)}
.sub{text-align:center;color:var(--muted);margin:10px 0 30px}
label{display:block;margin:16px 0 8px;font-size:13px;color:#ddd}
input{width:100%;padding:14px;background:#090909;border:1px solid var(--line);border-radius:10px;color:white;outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));font-weight:800;cursor:pointer}
.back{display:block;text-align:center;margin-top:22px;color:var(--gold2);text-decoration:none;font-size:14px}
.notice{margin-top:18px;padding:12px;border:1px solid #3a3020;border-radius:10px;color:#cfcfcf;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="box">
  <div class="brand">BEULEUP <span>SHOP</span></div>
  <p class="sub">Espace administrateur</p>
  <form id="login">
    <label for="user">Identifiant</label>
    <input id="user" autocomplete="username" required>
    <label for="pass">Mot de passe</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
  </form>
  <div class="notice">Accès réservé aux administrateurs. L’authentification sécurisée et les comptes des 3 admins seront connectés au backend à l’étape suivante.</div>
  <a class="back" href="./">← Retour à la boutique</a>
</main>
<script>
document.querySelector("#login").addEventListener("submit",e=>{e.preventDefault();alert("L’authentification backend sera connectée à l’étape suivante.");});
</script>
</body>
</html>
